<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Progressive Disclosure Architecture — Layer 1 Discovery, Layer 2 Activation, Layer 3 Execution and Org Safety Gates">
  <defs>
    <linearGradient id="arch-bg-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="1200" height="340" rx="16" fill="url(#arch-bg-light)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="15.25" fill="none" stroke="#dbe5f4" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="40" y="42" fill="#0f172a" font-size="20" font-weight="800">Progressive Disclosure &amp; Org Safety Architecture</text>
    <text x="40" y="64" fill="#475569" font-size="13.5">Consolidated from 44 fragmented skills to 17 domain owners — ~49% smaller discovery prefix, ~88% leaner activation body, zero orphaned references.</text>

    <!-- Layer 1 -->
    <rect x="40" y="88" width="336" height="162" rx="12" fill="#ffffff" stroke="#38bdf8" stroke-width="1.4"/>
    <rect x="56" y="104" width="150" height="22" rx="11" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="131" y="119" text-anchor="middle" fill="#0369a1" font-size="10.5" font-weight="700" letter-spacing="0.8">LAYER 1 · ALWAYS LOADED</text>
    <text x="56" y="149" fill="#0f172a" font-size="17" font-weight="700">Discovery Catalog</text>
    <text x="56" y="172" fill="#334155" font-size="12.5">• 17 single-line YAML descriptions</text>
    <text x="56" y="192" fill="#334155" font-size="12.5">• Explicit positive &amp; negative handoffs</text>
    <text x="56" y="212" fill="#334155" font-size="12.5">• ~1,180 tokens total for ~95% cache hits</text>
    <text x="56" y="234" fill="#0284c7" font-size="11.5" font-weight="600">.antigravity-plugin + .agents/marketplace</text>

    <!-- Arrow 1 -> 2 -->
    <line x1="382" y1="169" x2="424" y2="169" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-light)"/>

    <!-- Layer 2 -->
    <rect x="432" y="88" width="336" height="162" rx="12" fill="#ffffff" stroke="#818cf8" stroke-width="1.4"/>
    <rect x="448" y="104" width="156" height="22" rx="11" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="526" y="119" text-anchor="middle" fill="#4338ca" font-size="10.5" font-weight="700" letter-spacing="0.8">LAYER 2 · LOADED ON MATCH</text>
    <text x="448" y="149" fill="#0f172a" font-size="17" font-weight="700">Lean SKILL.md Router</text>
    <text x="448" y="172" fill="#334155" font-size="12.5">• 46–62 lines per skill entrypoint (avg 55L)</text>
    <text x="448" y="192" fill="#334155" font-size="12.5">• Upfront Mode / Domain routing table</text>
    <text x="448" y="212" fill="#334155" font-size="12.5">• Release 264+ invariants &amp; safety gates</text>
    <text x="448" y="234" fill="#4f46e5" font-size="11.5" font-weight="600">plugins/&lt;skill&gt;/skills/&lt;skill&gt;/SKILL.md</text>

    <!-- Arrow 2 -> 3 -->
    <line x1="774" y1="169" x2="816" y2="169" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-light)"/>

    <!-- Layer 3 -->
    <rect x="824" y="88" width="336" height="162" rx="12" fill="#ffffff" stroke="#2dd4bf" stroke-width="1.4"/>
    <rect x="840" y="104" width="166" height="22" rx="11" fill="#ccfbf1" stroke="#5eead4"/>
    <text x="923" y="119" text-anchor="middle" fill="#0f766e" font-size="10.5" font-weight="700" letter-spacing="0.8">LAYER 3 · LOADED ON DEMAND</text>
    <text x="840" y="149" fill="#0f172a" font-size="17" font-weight="700">Focused Refs &amp; CLIs</text>
    <text x="840" y="172" fill="#334155" font-size="12.5">• Mode-specific references (~45–75L)</text>
    <text x="840" y="192" fill="#334155" font-size="12.5">• Black-box Python/JS validators &amp; tracers</text>
    <text x="840" y="212" fill="#334155" font-size="12.5">• CI-verified zero orphans &amp; unit tests</text>
    <text x="840" y="234" fill="#0d9488" font-size="11.5" font-weight="600">references/*.md + scripts/*</text>

    <!-- Bottom Hard Safety Bar -->
    <rect x="40" y="268" width="1120" height="48" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="60" y="297" fill="#b45309" font-size="12" font-weight="800" letter-spacing="0.6">HARD ORG GATES:</text>
    <text x="196" y="297" fill="#334155" font-size="12.5" font-weight="500">Read-Only Audits Never Mutate   ·   Explicit --target-org Pinning   ·   Approval Required for Prod / Publish   ·   Static vs Executed CLI vs Not Verified</text>
  </g>
</svg>
