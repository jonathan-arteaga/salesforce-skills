<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Progressive Disclosure Architecture — Layer 1 Discovery, Layer 2 Activation, Layer 3 Execution and Org Safety Gates">
  <defs>
    <linearGradient id="arch-bg-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1200" height="340" rx="16" fill="url(#arch-bg-dark)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="15.25" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="40" y="42" fill="#f8fafc" font-size="20" font-weight="800">Progressive Disclosure &amp; Org Safety Architecture</text>
    <text x="40" y="64" fill="#94a3b8" font-size="13.5">Consolidated from 44 fragmented skills to 17 domain owners — ~49% smaller discovery prefix, ~88% leaner activation body, zero orphaned references.</text>

    <!-- Layer 1 -->
    <rect x="40" y="88" width="336" height="162" rx="12" fill="#0f1e35" stroke="#0284c7" stroke-width="1.4"/>
    <rect x="56" y="104" width="150" height="22" rx="11" fill="#082f49" stroke="#0ea5e9" stroke-opacity="0.6"/>
    <text x="131" y="119" text-anchor="middle" fill="#7dd3fc" font-size="10.5" font-weight="700" letter-spacing="0.8">LAYER 1 · ALWAYS LOADED</text>
    <text x="56" y="149" fill="#f8fafc" font-size="17" font-weight="700">Discovery Catalog</text>
    <text x="56" y="172" fill="#cbd5e1" font-size="12.5">• 17 single-line YAML descriptions</text>
    <text x="56" y="192" fill="#cbd5e1" font-size="12.5">• Explicit positive &amp; negative handoffs</text>
    <text x="56" y="212" fill="#cbd5e1" font-size="12.5">• ~1,180 tokens total for ~95% cache hits</text>
    <text x="56" y="234" fill="#38bdf8" font-size="11.5" font-weight="600">.antigravity-plugin + .agents/marketplace</text>

    <!-- Arrow 1 -> 2 -->
    <line x1="382" y1="169" x2="424" y2="169" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-dark)"/>

    <!-- Layer 2 -->
    <rect x="432" y="88" width="336" height="162" rx="12" fill="#131c36" stroke="#6366f1" stroke-width="1.4"/>
    <rect x="448" y="104" width="156" height="22" rx="11" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.6"/>
    <text x="526" y="119" text-anchor="middle" fill="#c7d2fe" font-size="10.5" font-weight="700" letter-spacing="0.8">LAYER 2 · LOADED ON MATCH</text>
    <text x="448" y="149" fill="#f8fafc" font-size="17" font-weight="700">Lean SKILL.md Router</text>
    <text x="448" y="172" fill="#cbd5e1" font-size="12.5">• 46–62 lines per skill entrypoint (avg 55L)</text>
    <text x="448" y="192" fill="#cbd5e1" font-size="12.5">• Upfront Mode / Domain routing table</text>
    <text x="448" y="212" fill="#cbd5e1" font-size="12.5">• Release 264+ invariants &amp; safety gates</text>
    <text x="448" y="234" fill="#a5b4fc" font-size="11.5" font-weight="600">plugins/&lt;skill&gt;/skills/&lt;skill&gt;/SKILL.md</text>

    <!-- Arrow 2 -> 3 -->
    <line x1="774" y1="169" x2="816" y2="169" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-dark)"/>

    <!-- Layer 3 -->
    <rect x="824" y="88" width="336" height="162" rx="12" fill="#0f252a" stroke="#14b8a6" stroke-width="1.4"/>
    <rect x="840" y="104" width="166" height="22" rx="11" fill="#042f2e" stroke="#2dd4bf" stroke-opacity="0.6"/>
    <text x="923" y="119" text-anchor="middle" fill="#99f6e4" font-size="10.5" font-weight="700" letter-spacing="0.8">LAYER 3 · LOADED ON DEMAND</text>
    <text x="840" y="149" fill="#f8fafc" font-size="17" font-weight="700">Focused Refs &amp; CLIs</text>
    <text x="840" y="172" fill="#cbd5e1" font-size="12.5">• Mode-specific references (~45–75L)</text>
    <text x="840" y="192" fill="#cbd5e1" font-size="12.5">• Black-box Python/JS validators &amp; tracers</text>
    <text x="840" y="212" fill="#cbd5e1" font-size="12.5">• CI-verified zero orphans &amp; unit tests</text>
    <text x="840" y="234" fill="#2dd4bf" font-size="11.5" font-weight="600">references/*.md + scripts/*</text>

    <!-- Bottom Hard Safety Bar -->
    <rect x="40" y="268" width="1120" height="48" rx="10" fill="#171e2e" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="60" y="297" fill="#fbbf24" font-size="12" font-weight="800" letter-spacing="0.6">HARD ORG GATES:</text>
    <text x="196" y="297" fill="#e2e8f0" font-size="12.5" font-weight="500">Read-Only Audits Never Mutate   ·   Explicit --target-org Pinning   ·   Approval Required for Prod / Publish   ·   Static vs Executed CLI vs Not Verified</text>
  </g>
</svg>
