name: Verify marketplace

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python3 scripts/package_marketplace.py --check
      - run: python3 -m pip install -r requirements-validation.txt
      - run: python3 scripts/validate_skills.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m unittest discover -s plugins/agentforce-review/skills/agentforce-review/scripts/tests -t plugins/agentforce-review/skills/agentforce-review/scripts
      - run: python3 -m unittest discover -s plugins/agentforce-observe/skills/agentforce-observe/scripts/tests -t plugins/agentforce-observe/skills/agentforce-observe/scripts
